<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 150" role="img" aria-label="Production private, demo icin yazin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C1018"/>
      <stop offset="100%" stop-color="#151C2B"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F1E0B0"/>
      <stop offset="100%" stop-color="#C9A227"/>
    </linearGradient>
  </defs>
  
<style>
  .glow { animation: glow 4.5s ease-in-out infinite; }
  .sweep { animation: sweep 5.5s linear infinite; }
  .pulse { animation: pulse 2.8s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { opacity: .12; }
    50% { opacity: .32; }
  }
  @keyframes sweep {
    0% { transform: translateX(-280px); opacity: 0; }
    18% { opacity: .45; }
    100% { transform: translateX(1680px); opacity: 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: .55; }
    50% { opacity: 1; }
  }
</style>

  <rect width="1600" height="150" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1598" height="148" rx="17" fill="none" stroke="#C9A227" stroke-opacity=".45"/>
  <rect x="0" y="0" width="8" height="150" fill="url(#gold)"/>
  <circle class="pulse" cx="78" cy="75" r="26" fill="none" stroke="#C9A227" stroke-width="1.4"/>
  <path d="M70 70 h16 v22 h-16 z M74 70 v-6 a6 6 0 0 1 12 0 v6" fill="none" stroke="#F1E0B0" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="128" y="64" fill="#C9A227" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="5">PRIVATE  ·  PRODUCTION</text>
  <text x="128" y="98" fill="#F4F0E6" font-family="Georgia, Times New Roman, serif" font-size="28">Canl&#305; uygulamalar&#305;n kayna&#287;&#305; private.</text>
  <rect x="1188" y="48" width="360" height="54" rx="27" fill="#C9A227"/>
  <text x="1368" y="82" text-anchor="middle" fill="#0B1220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Demo i&#231;in yaz&#305;n  →</text>
</svg>
